[project]
name = "radiosensitivity-biomarker"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    # data fetching
    "requests>=2.31",
    "GEOparse>=2.0",
    # normalization
    "rnanorm>=2.1",
    # core data stack
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "anndata>=0.10",
    "scanpy>=1.9",
    # survival analysis
    "lifelines>=0.29",
    "statsmodels>=0.14",
    # plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1.6",
]

